# Netlify Configuration for Admin Management Portal (apps/admin)
# Project 2 -> admin.yourchurch.org / admin.rccgchm.com

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  SECRETS_SCAN_ENABLED = "false"

[context.production.environment]
  SECRETS_SCAN_ENABLED = "false"

# Single-Page Application (SPA) routing fallback for Sanity Studio
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
