# Netlify Configuration for Admin Management Portal (apps/admin)
# Project 2 -> admin.rccgchm.org / admin.rccgchm.com

[build]
  command = "npm run build"
  publish = "dist"

# Single-Page Application (SPA) routing fallback for Sanity Studio
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"

