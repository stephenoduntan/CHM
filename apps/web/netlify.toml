# Netlify Configuration for Main Church Website (apps/web)
# Project 1 -> yourchurch.org / rccgchm.com

[build]
  command = "npm run build"
  publish = ".next"
  SECRETS_SCAN_ENABLED = false

[context.production]
  environment = { SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SANITY_PROJECT_ID,NEXT_PUBLIC_SANITY_DATASET,SANITY_API_WRITE_TOKEN" }
  
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Optional security & caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

