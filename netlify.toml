# Root Netlify Configuration
# When deploying to Netlify, each site should point to its package directory:
# - Project 1 (Main Website): Base Directory = "apps/web", Publish Directory = ".next"
# - Project 2 (Admin Portal): Base Directory = "apps/admin", Publish Directory = "dist"

[build]
  base = "apps/web"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--legacy-peer-deps"
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_OMIT_PATHS = ".next/**,apps/web/.next/**"
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SANITY_PROJECT_ID,NEXT_PUBLIC_SANITY_DATASET,SANITY_API_WRITE_TOKEN"

[context.production.environment]
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_OMIT_PATHS = ".next/**,apps/web/.next/**"
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SANITY_PROJECT_ID,NEXT_PUBLIC_SANITY_DATASET,SANITY_API_WRITE_TOKEN"

[context.deploy-preview.environment]
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_OMIT_PATHS = ".next/**,apps/web/.next/**"
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SANITY_PROJECT_ID,NEXT_PUBLIC_SANITY_DATASET,SANITY_API_WRITE_TOKEN"

[context.branch-deploy.environment]
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_OMIT_PATHS = ".next/**,apps/web/.next/**"
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SANITY_PROJECT_ID,NEXT_PUBLIC_SANITY_DATASET,SANITY_API_WRITE_TOKEN"

[[plugins]]
  package = "@netlify/plugin-nextjs"
